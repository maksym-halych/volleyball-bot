name: Analyze poll votes

on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months back to analyze"
        default: "3"
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Analyze votes
        run: uv run python analyze_votes.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          MONTHS: ${{ inputs.months }}
          OUTPUT_DIR: vote-report

      - uses: actions/upload-artifact@v4
        with:
          name: vote-report
          path: vote-report/
          retention-days: 7
